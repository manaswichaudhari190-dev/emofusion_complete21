version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: emofusion_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emofusion_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/emofusion
      - SECRET_KEY=emofusion-docker-secret-change-me
      - FLASK_ENV=production
    depends_on:
      - mongo
    volumes:
      - ./backend/ml_models:/app/ml_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emofusion_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
